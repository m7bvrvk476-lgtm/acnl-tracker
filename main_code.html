<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACNL: Welcome Amiibo Complete Tracker</title>
  <style>
    :root {
      --bg-color: #f4f1ea;
      --card-bg: #ffffff;
      --primary: #4e9f70;
      --primary-dark: #377351;
      --accent: #e59866;
      --text: #2c3e50;
      --subtext: #7f8c8d;
      --border: #dcd6cd;
      --card-done: #edf7f2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.03);
    }

    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 { color: var(--primary-dark); font-size: 1.6rem; display: flex; align-items: center; gap: 8px; }

    .overall-progress { width: 100%; }
    .progress-bar-bg {
      background: #e0e0e0;
      border-radius: 10px;
      height: 18px;
      width: 100%;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, var(--primary), #6cc091);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--subtext);
      font-weight: bold;
    }

    /* Controls & Navigation */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    input[type="text"], select {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      flex: 1 1 180px;
    }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      padding: 10px 14px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-dark); }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }

    /* Nav Tabs */
    .category-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .tab {
      padding: 8px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      font-weight: 500;
    }
    .tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.1s, border-color 0.2s;
    }
    .card.completed {
      background: var(--card-done);
      border-color: #bce3cf;
    }

    .card-info { display: flex; flex-direction: column; gap: 2px; }
    .card-title { font-weight: 600; font-size: 0.95rem; }
    .card-meta { font-size: 0.75rem; color: var(--subtext); text-transform: uppercase; }

    .checkbox-group { display: flex; gap: 12px; align-items: center; }
    .checkbox-label {
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--subtext);
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px dashed var(--border);
    }

    /* Dataset Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    textarea {
      width: 100%;
      height: 200px;
      margin: 10px 0;
      padding: 10px;
      font-family: monospace;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-main">
      <h1>🍃 ACNL: Welcome Amiibo Tracker</h1>
      <div class="btn-group">
        <button class="btn-secondary" onclick="exportSaveData()">Export Save</button>
        <button class="btn-secondary" onclick="document.getElementById('importFileInput').click()">Import Save</button>
        <button onclick="openDatasetModal()">Import Dataset JSON</button>
        <input type="file" id="importFileInput" style="display:none" onchange="importSaveData(event)">
      </div>
    </div>

    <div class="overall-progress">
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
      <div class="progress-stats">
        <span id="progressText">0 / 0 Completed</span>
        <span id="progressPercent">0%</span>
      </div>
    </div>
  </header>

  <div class="category-tabs" id="categoryTabs"></div>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search items by name...">
    <select id="statusFilter">
      <option value="ALL">All Items</option>
      <option value="UNOBTAINED">Need / Unobtained</option>
      <option value="COMPLETED">Completed</option>
    </select>
  </div>

  <main id="itemGrid" class="grid"></main>

  <!-- Modal for Bulk Dataset Loading -->
  <div id="datasetModal" class="modal">
    <div class="modal-content">
      <h2>Import Item Dataset</h2>
      <p style="font-size: 0.85rem; color: #666; margin-top: 4px;">Paste a JSON array containing your items list. Format: <code>[{"id":"001", "name":"Item Name", "category":"Furniture"}]</code></p>
      <textarea id="datasetInput" placeholder="Paste JSON dataset here..."></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn-secondary" onclick="closeDatasetModal()">Cancel</button>
        <button onclick="saveCustomDataset()">Load Dataset</button>
      </div>
    </div>
  </div>

  <script>
    // Built-in starter dataset across standard categories & creatures
    const DEFAULT_DATASET = [
      // Standard Catalog Items
      { id: "furn_001", name: "Alpine Bed", category: "Furniture" },
      { id: "furn_002", name: "Alpine Chair", category: "Furniture" },
      { id: "furn_003", name: "Amiibo Shelf", category: "Furniture" },
      { id: "cloth_001", name: "AAA Shirt", category: "Clothing" },
      { id: "cloth_002", name: "Hero's Clothes", category: "Clothing" },
      { id: "tool_001", name: "Golden Shovel", category: "Tools" },
      { id: "tool_002", name: "Silver Net", category: "Tools" },
      { id: "foss_001", name: "T-Rex Skull", category: "Fossils" },
      { id: "foss_002", name: "T-Rex Torso", category: "Fossils" },
      { id: "gyr_001", name: "Mega Bowtoid", category: "Gyroids" },
      { id: "art_001", name: "Amazing Painting", category: "Art" },

      // Creatures (Dual tracking: Caught & Donated)
      { id: "bug_001", name: "Common Butterfly", category: "Bugs" },
      { id: "bug_002", name: "Agrias Butterfly", category: "Bugs" },
      { id: "bug_003", name: "Golden Goliath Beetle", category: "Bugs" },
      { id: "fish_001", name: "Bitterling", category: "Fish" },
      { id: "fish_002", name: "Red Snapper", category: "Fish" },
      { id: "fish_003", name: "Coelacanth", category: "Fish" },
      { id: "sea_001", name: "Sea Grape", category: "Sea Creatures" },
      { id: "sea_002", name: "Scallop", category: "Sea Creatures" },
      { id: "sea_003", name: "Giant Isopod", category: "Sea Creatures" }
    ];

    const STORAGE_ITEMS_KEY = 'acnl_dataset_items_v2';
    const STORAGE_USER_STATE_KEY = 'acnl_user_progress_v2';

    let currentCategory = 'ALL';

    function getItems() {
      const stored = localStorage.getItem(STORAGE_ITEMS_KEY);
      return stored ? JSON.parse(stored) : DEFAULT_DATASET;
    }

    function getUserState() {
      return JSON.parse(localStorage.getItem(STORAGE_USER_STATE_KEY) || '{}');
    }

    function setUserState(state) {
      localStorage.setItem(STORAGE_USER_STATE_KEY, JSON.stringify(state));
      render();
    }

    function updateState(itemId, property, isChecked) {
      const state = getUserState();
      if (!state[itemId]) state[itemId] = {};
      state[itemId][property] = isChecked;

      // Donating a creature automatically marks it as caught
      if (property === 'donated' && isChecked) {
        state[itemId]['caught'] = true;
      }

      setUserState(state);
    }

    function renderTabs(items) {
      const categories = ['ALL', ...new Set(items.map(i => i.category))];
      const tabsContainer = document.getElementById('categoryTabs');
      tabsContainer.innerHTML = '';

      categories.forEach(cat => {
        const tab = document.createElement('div');
        tab.className = `tab ${cat === currentCategory ? 'active' : ''}`;
        tab.innerText = cat;
        tab.onclick = () => {
          currentCategory = cat;
          render();
        };
        tabsContainer.appendChild(tab);
      });
    }

    function render() {
      const items = getItems();
      const userState = getUserState();
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const grid = document.getElementById('itemGrid');

      renderTabs(items);
      grid.innerHTML = '';

      let totalPoints = 0;
      let earnedPoints = 0;
      let visibleCount = 0;

      items.forEach(item => {
        const isCreature = ['Bugs', 'Fish', 'Sea Creatures'].includes(item.category);
        const itemState = userState[item.id] || {};

        // Metrics Calculation
        if (isCreature) {
          totalPoints += 2;
          if (itemState.caught) earnedPoints++;
          if (itemState.donated) earnedPoints++;
        } else {
          totalPoints += 1;
          if (itemState.cataloged) earnedPoints++;
        }

        // Apply Category Filter
        if (currentCategory !== 'ALL' && item.category !== currentCategory) return;

        // Apply Search Filter
        if (search && !item.name.toLowerCase().includes(search)) return;

        // Apply Status Filter
        const isCompleted = isCreature 
          ? (itemState.caught && itemState.donated)
          : itemState.cataloged;

        if (statusFilter === 'COMPLETED' && !isCompleted) return;
        if (statusFilter === 'UNOBTAINED' && isCompleted) return;

        visibleCount++;

        // Render Card
        const card = document.createElement('div');
        card.className = `card ${isCompleted ? 'completed' : ''}`;

        let controlsHTML = '';
        if (isCreature) {
          controlsHTML = `
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" ${itemState.caught ? 'checked' : ''} 
                  onchange="updateState('${item.id}', 'caught', this.checked)"> Caught
              </label>
              <label class="checkbox-label">
                <input type="checkbox" ${itemState.donated ? 'checked' : ''} 
                  onchange="updateState('${item.id}', 'donated', this.checked)"> Donated
              </label>
            </div>`;
        } else {
          controlsHTML = `
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" ${itemState.cataloged ? 'checked' : ''} 
                  onchange="updateState('${item.id}', 'cataloged', this.checked)"> Cataloged
              </label>
            </div>`;
        }

        card.innerHTML = `
          <div class="card-info">
            <span class="card-title">${item.name}</span>
            <span class="card-meta">${item.category}</span>
          </div>
          ${controlsHTML}
        `;

        grid.appendChild(card);
      });

      if (visibleCount === 0) {
        grid.innerHTML = `<div class="empty-state">No items match your selected filters.</div>`;
      }

      // Update Header Progress Stats
      const pct = totalPoints > 0 ? ((earnedPoints / totalPoints) * 100).toFixed(1) : 0;
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('progressText').innerText = `${earnedPoints} / ${totalPoints} Collectibles Earned`;
      document.getElementById('progressPercent').innerText = `${pct}%`;
    }

    // Export & Import User Save File
    function exportSaveData() {
      const data = localStorage.getItem(STORAGE_USER_STATE_KEY) || '{}';
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `acnl_save_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importSaveData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          JSON.parse(evt.target.result);
          localStorage.setItem(STORAGE_USER_STATE_KEY, evt.target.result);
          render();
          alert('Save data loaded successfully!');
        } catch (err) {
          alert('Invalid JSON save file.');
        }
      };
      reader.readAsText(file);
    }

    // Modal Dataset Handlers
    function openDatasetModal() { document.getElementById('datasetModal').style.display = 'flex'; }
    function closeDatasetModal() { document.getElementById('datasetModal').style.display = 'none'; }
    function saveCustomDataset() {
      const val = document.getElementById('datasetInput').value;
      try {
        const parsed = JSON.parse(val);
        if (Array.isArray(parsed)) {
          localStorage.setItem(STORAGE_ITEMS_KEY, JSON.stringify(parsed));
          closeDatasetModal();
          render();
          alert('New dataset loaded successfully!');
        } else {
          alert('JSON must be an array of item objects.');
        }
      } catch(e) {
        alert('Invalid JSON syntax.');
      }
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('statusFilter').addEventListener('change', render);

    // Initial Render
    render();
  </script>
</body>
</html>
